name: Service CI/CD

on:
  push:
    branches:
      - dev
      - master
  workflow_dispatch:

jobs:
  service:
    uses: PipelineIQproject/pipeline_main/.github/workflows/reusable-node-service-ci.yml@dev
    with:
      service_name: auth-service
      image_name: final_capstone-auth-service
      dockerfile: services/auth-service/Dockerfile
      node_project_dir: services/auth-service
      chart_path: auth-service
      container_port: "8081"
      smoke_mode: command
      sonar_organization: pipelineiqproject
      sonar_project_key: pipelineiq-auth-service
    secrets: inherit
